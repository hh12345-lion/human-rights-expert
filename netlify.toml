[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Lead_notification_setup.md — rewrite so production uses the Netlify function
# (not the Next.js App Router route). Local `next dev` still uses app/api/submit-lead.
# AHREFS_WWW_APEX_REDIRECT — flatten https://www → apex (reduces Ahrefs redirect-chain)
[[redirects]]
  from = "/*"
  to = "https://humanrightsexperts.com/:splat"
  status = 301
  force = true
  conditions = {Host = ["www.humanrightsexperts.com"]}

[[redirects]]
  from = "/api/submit-lead"
  to = "/.netlify/functions/submit-lead"
  status = 200
  force = true

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
